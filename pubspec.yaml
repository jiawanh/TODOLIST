name: todo_list
description: A minimalist, cross-platform task list with Markdown storage.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5

  # Local notifications (all platforms)
  flutter_local_notifications: ^18.0.1

  # File system & path
  path_provider: ^2.1.4
  path: ^1.9.0

  # Directory / file picker
  file_picker: ^8.1.4

  # Date & time formatting
  intl: ^0.20.2

  # Markdown rendering
  flutter_markdown: ^0.7.4+1

  # Settings persistence
  shared_preferences: ^2.3.3

  # System tray (desktop)

  # Timezone for notifications
  timezone: ^0.9.4
  flutter_timezone: ^2.0.0

  # Permission handling (mobile)
  permission_handler: ^11.3.1

  # Window management (desktop)
  window_manager: ^0.4.3

  # Icons
  cupertino_icons: ^1.0.8
  tray_manager: ^0.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.ico
    - assets/icons/tray_icon.png
    - assets/icons/tray_icon@2x.png
